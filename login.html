<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Transparencia - UNSCH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: #fff;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 2px;
            color: #00d2ff;
        }
        .input-group { margin-bottom: 25px; position: relative; }
        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            margin-bottom: 30px;
            border: none;
            border-bottom: 1px solid #fff;
            outline: none;
            background: transparent;
        }
        .input-group label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            pointer-events: none;
            transition: .5s;
        }
        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -20px; left: 0; color: #00d2ff; font-size: 12px;
        }
        button {
            width: 100%; background: #00d2ff; color: #000;
            border: none; padding: 12px; border-radius: 5px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover { background: #3a7bd5; color: #fff; }
        
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
        .success { color: #00ff88; }
        .error { color: #ff4c4c; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>TRANSPARENCIA</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="usuario" required>
                <label>Usuario</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required>
                <label>Contraseña</label>
            </div>
            <button type="submit">INGRESAR</button>
            <div id="mensaje"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const divMensaje = document.getElementById('mensaje');
            
            divMensaje.textContent = "Conectando...";
            divMensaje.className = "";

            try {
                // CORRECCIÓN APLICADA: Ruta relativa en lugar de http://localhost:3000
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, password: password })
                });

                const datos = await respuesta.json();

                if (datos.success) {
                    divMensaje.textContent = `¡Bienvenido ${datos.usuario.Usuario}! Redirigiendo... 🚀`;
                    divMensaje.className = "success";
                    
                    localStorage.setItem('usuarioSGP', JSON.stringify(datos.usuario));
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    divMensaje.textContent = datos.message;
                    divMensaje.className = "error";
                }
            } catch (error) {
                divMensaje.textContent = "Error al conectar con el servidor SGP Systems.";
                divMensaje.className = "error";
            }
        });
    </script>
</body>
</html>
